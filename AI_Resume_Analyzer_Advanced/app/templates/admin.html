{% extends "base.html" %}
{% block title %}Admin{% endblock %}
{% block content %}
<p class="eyebrow">ADMIN CONTROL CENTER</p>
<h1>System Management</h1>
<section class="grid three">
<div class="stat"><small>Total Users</small><strong>{{ users }}</strong></div>
<div class="stat"><small>Total Jobs</small><strong>{{ jobs }}</strong></div>
<div class="stat"><small>AI Engine</small><strong>ON</strong></div>
</section>
<section class="panel">
<h2>Add Job</h2>
<form method="post" action="/admin/jobs/new">
<input name="title" placeholder="Job title" required>
<input name="company" placeholder="Company" required>
<input name="location" placeholder="Location">
<input name="required_skills" placeholder="Python, SQL, Machine Learning">
<input name="min_experience" type="number" step="0.5" placeholder="Minimum experience">
<textarea name="description" placeholder="Complete job description" required></textarea>
<button class="btn">Add Job</button>
</form>
</section>
{% endblock %}
